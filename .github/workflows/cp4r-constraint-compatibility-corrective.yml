name: CP4R Constraint Compatibility Corrective

on:
  push:
    branches:
      - implementation/mandatory-contract-admission-v1
    paths:
      - .github/workflows/cp4r-constraint-compatibility-corrective.yml

permissions:
  contents: write

jobs:
  corrective-change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/mandatory-contract-admission-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Correct migration and extend tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          migration = Path('supabase/migrations/20260725223000_contract_admission_runtime_hardening_v1.sql')
          sql = migration.read_text()
          old = "drop index if exists public.apios_natcorp_delivery_feed_v_admitted_contract_id_business_key;"
          replacement = r"""-- Fail closed before changing the legacy identity. The replacement key treats
-- nullable business identifiers deterministically and must not collapse existing rows.
do $$
declare
  v_duplicate_count bigint;
  v_duplicate_detail text;
  v_constraint_exists boolean := false;
  v_independent_index_exists boolean := false;
begin
  select count(*),
         string_agg(
           format(
             'identity=(%s,%s,%s,%s) delivery_feed_ids=[%s]',
             admitted_contract_id,
             normalized_business_profile_id,
             normalized_match_id,
             delivery_fingerprint,
             delivery_feed_ids
           ),
           '; ' order by admitted_contract_id, normalized_business_profile_id, normalized_match_id, delivery_fingerprint
         )
  into v_duplicate_count, v_duplicate_detail
  from (
    select
      admitted_contract_id,
      coalesce(business_profile_id,'00000000-0000-0000-0000-000000000000'::uuid) as normalized_business_profile_id,
      coalesce(match_id,'00000000-0000-0000-0000-000000000000'::uuid) as normalized_match_id,
      delivery_fingerprint,
      string_agg(delivery_feed_id::text, ',' order by delivery_feed_id) as delivery_feed_ids
    from public.apios_natcorp_delivery_feed_v2
    group by
      admitted_contract_id,
      coalesce(business_profile_id,'00000000-0000-0000-0000-000000000000'::uuid),
      coalesce(match_id,'00000000-0000-0000-0000-000000000000'::uuid),
      delivery_fingerprint
    having count(*) > 1
  ) duplicate_identity;

  if v_duplicate_count > 0 then
    raise exception
      'replacement delivery identity has % duplicate business identities',
      v_duplicate_count
      using errcode = '23505',
            detail = coalesce(v_duplicate_detail, 'Duplicate evidence unavailable. No delivery rows were changed.'),
            hint = 'No delivery rows were changed. Resolve duplicate identities through governance before replay.';
  end if;

  select exists (
    select 1
    from pg_catalog.pg_constraint con
    join pg_catalog.pg_class tbl on tbl.oid = con.conrelid
    join pg_catalog.pg_namespace nsp on nsp.oid = tbl.relnamespace
    join pg_catalog.pg_class idx on idx.oid = con.conindid
    join pg_catalog.pg_index pi on pi.indexrelid = idx.oid and pi.indrelid = tbl.oid
    join pg_catalog.pg_depend dep
      on dep.classid = 'pg_class'::regclass
     and dep.objid = idx.oid
     and dep.refclassid = 'pg_constraint'::regclass
     and dep.refobjid = con.oid
     and dep.deptype in ('i','a')
    where nsp.nspname = 'public'
      and tbl.relname = 'apios_natcorp_delivery_feed_v2'
      and con.conname = 'apios_natcorp_delivery_feed_v_admitted_contract_id_business_key'
      and idx.relname = 'apios_natcorp_delivery_feed_v_admitted_contract_id_business_key'
  ) into v_constraint_exists;

  if v_constraint_exists then
    alter table public.apios_natcorp_delivery_feed_v2
      drop constraint if exists apios_natcorp_delivery_feed_v_admitted_contract_id_business_key;
  else
    select exists (
      select 1
      from pg_catalog.pg_class idx
      join pg_catalog.pg_namespace nsp on nsp.oid = idx.relnamespace
      join pg_catalog.pg_index pi on pi.indexrelid = idx.oid
      left join pg_catalog.pg_depend dep
        on dep.classid = 'pg_class'::regclass
       and dep.objid = idx.oid
       and dep.refclassid = 'pg_constraint'::regclass
       and dep.deptype in ('i','a')
      where nsp.nspname = 'public'
        and idx.relname = 'apios_natcorp_delivery_feed_v_admitted_contract_id_business_key'
        and pi.indrelid = 'public.apios_natcorp_delivery_feed_v2'::regclass
        and dep.objid is null
    ) into v_independent_index_exists;

    if v_independent_index_exists then
      drop index if exists public.apios_natcorp_delivery_feed_v_admitted_contract_id_business_key;
    end if;
  end if;
end;
$$;"""
          if old not in sql:
              raise SystemExit('expected invalid direct drop statement not found')
          sql = sql.replace(old, replacement, 1)
          migration.write_text(sql)

          test_path = Path('tests/contract-admission-delivery-identity-compatibility.test.mjs')
          tests = test_path.read_text()
          addition = r"""

test('runtime hardening independently handles constraint-backed, independent-index, absent, and replay states', () => {
  for (const catalog of ['pg_catalog.pg_constraint', 'pg_catalog.pg_class', 'pg_catalog.pg_namespace', 'pg_catalog.pg_index', 'pg_catalog.pg_depend']) {
    assert.match(runtimeSql, new RegExp(catalog.replaceAll('.', '\\.')));
  }
  assert.match(runtimeSql, /if v_constraint_exists then/);
  assert.match(runtimeSql, /alter table public\.apios_natcorp_delivery_feed_v2\s+drop constraint if exists/);
  assert.match(runtimeSql, /if v_independent_index_exists then/);
  assert.match(runtimeSql, /drop index if exists public\.apios_natcorp_delivery_feed_v_admitted_contract_id_business_key/);
  assert.doesNotMatch(runtimeSql, /cascade/);
  assert.doesNotMatch(runtimeSql, /delete\s+from\s+public\.apios_natcorp_delivery_feed_v2/);
});

test('runtime hardening fails closed with duplicate evidence before legacy identity removal', () => {
  assert.match(runtimeSql, /having count\(\*\) > 1/);
  assert.match(runtimeSql, /string_agg\(delivery_feed_id::text/);
  assert.match(runtimeSql, /raise exception/);
  assert.match(runtimeSql, /no delivery rows were changed/i);
});

test('replacement identity enforces every nullable business-key state', () => {
  assert.match(runtimeSql, /coalesce\(business_profile_id,'00000000-0000-0000-0000-000000000000'::uuid\)/);
  assert.match(runtimeSql, /coalesce\(match_id,'00000000-0000-0000-0000-000000000000'::uuid\)/);
  assert.match(runtimeSql, /delivery_fingerprint/);
  assert.match(runtimeSql, /create unique index if not exists apios_natcorp_delivery_v2_identity_unique_idx/);
});
"""
          if "runtime hardening independently handles constraint-backed" not in tests:
              test_path.write_text(tests + addition)
          PY
      - name: Command Center Validation
        run: npm test
      - name: Remove one-time corrective workflow
        run: rm .github/workflows/cp4r-constraint-compatibility-corrective.yml
      - name: Commit governed correction
        shell: bash
        run: |
          git config user.name "apiOS-command-center-engineering"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/migrations/20260725223000_contract_admission_runtime_hardening_v1.sql tests/contract-admission-delivery-identity-compatibility.test.mjs .github/workflows/cp4r-constraint-compatibility-corrective.yml
          git commit -m "Fix delivery identity constraint compatibility"
          git push origin HEAD:implementation/mandatory-contract-admission-v1
