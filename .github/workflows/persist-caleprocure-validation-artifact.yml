# retry after canonical sync constraint correction
name: Persist Cal eProcure Validation Artifact

on:
  push:
    branches:
      - caleprocure-persistence-validation-001
    paths:
      - scripts/persist-caleprocure-validation-artifact.mjs
      - .github/workflows/persist-caleprocure-validation-artifact.yml
      - scripts/acquire-caleprocure-package-batch.mjs
      - .github/workflows/acquire-caleprocure-package-batch.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  persist:
    if: ${{ !contains(github.event.head_commit.message, 'Run queue batch') }}
    concurrency:
      group: caleprocure-persistence-validation-001
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out validation branch
        run: |
          git clone --depth 1 --branch caleprocure-persistence-validation-001 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repository
      - name: Set up Node.js 20
        run: |
          if [ -x /opt/hostedtoolcache/node/20.20.2/x64/bin/node ]; then echo "/opt/hostedtoolcache/node/20.20.2/x64/bin" >> "$GITHUB_PATH"; fi
      - name: Install repository dependencies
        working-directory: repository
        run: npm install
      - name: Download verified validation artifact
        working-directory: repository
        run: gh api -H 'Accept: application/vnd.github+json' repos/${GITHUB_REPOSITORY}/actions/artifacts/8921004540/zip > caleprocure-multi-event-validation.zip
      - name: Verify artifact SHA-256
        working-directory: repository
        run: test "$(sha256sum caleprocure-multi-event-validation.zip | awk '{print $1}')" = '91aee569cb7ff82a51b20ee1cb29c0aea85731e61298967ff89538b1f4657b50'
      - name: Correct artifact package directory resolution
        working-directory: repository
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/persist-caleprocure-validation-artifact.mjs'); t=p.read_text(); r="f.includes(({'0000039706':'DGS-25-322011-WINDOW-SYSTEMS','7CA07976':'CALFIRE-7CA07976-GENERATOR','0000039831':'DOJ-26-0060-AIRCRAFT'}[eventId]))"; p.write_text(t.replace('f.includes(eventId)',r))
          PY
      - name: Persist and reconcile packages
        working-directory: repository
        run: node scripts/persist-caleprocure-validation-artifact.mjs caleprocure-multi-event-validation.zip

  acquire_batch:
    if: ${{ contains(github.event.head_commit.message, 'Run queue batch') }}
    concurrency:
      group: caleprocure-package-acquisition
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GH_TOKEN: ${{ github.token }}
      BATCH_SIZE: '5'
    steps:
      - name: Check out validation branch
        run: |
          git clone --depth 1 --branch caleprocure-persistence-validation-001 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repository
      - name: Set up Node.js 20
        run: |
          if [ -x /opt/hostedtoolcache/node/20.20.2/x64/bin/node ]; then echo "/opt/hostedtoolcache/node/20.20.2/x64/bin" >> "$GITHUB_PATH"; fi
      - name: Install dependencies
        working-directory: repository
        run: npm install
      - name: Install Chromium
        working-directory: repository
        run: npx playwright install --with-deps chromium
      - name: Execute queue-driven package batch
        working-directory: repository
        run: node scripts/acquire-caleprocure-package-batch.mjs
