name: Manual NAU Acquisition Probe

on:
  push:
    branches:
      - ops/nau-manual-acquisition-probe-20260805

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out isolated probe branch
        uses: actions/checkout@v4
      - name: Execute NAU full-package acquisition probe
        run: node scripts/manual-nau-acquisition-probe.mjs
