name: Process PostgreSQL Command Queue

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/process-postgres-command-queue.mjs
      - .github/workflows/process-postgres-command-queue.yml
      - netlify/functions/command-acquisition-worker-background.js
      - netlify/functions/command-publisher-expansion-worker-background.js
      - netlify/functions/command-verify-publisher-connection-background.js
      - netlify/functions/command-verify-publisher-connection-queue.js
      - netlify/functions/_shared/acquisition-connectors/**
      - netlify/functions/command-mission-control.js
      - netlify/functions/command-mission-control-team.js
      - netlify/functions/_shared/agent-team.js
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: apie-postgres-command-queue
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_DISCOVERY_MODEL: ${{ vars.OPENAI_DISCOVERY_MODEL }}
      POSTGRES_QUEUE_MAX_JOBS: '1'
      POSTGRES_QUEUE_LEASE_SECONDS: '900'
      POSTGRES_QUEUE_WORKER_ID: github-actions:${{ github.run_id }}:${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright adapter runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Validate PostgreSQL queue worker
        run: node --check scripts/process-postgres-command-queue.mjs

      - name: Claim and process next PostgreSQL command
        # One durable queue item per workflow run; scheduled continuation handles remaining jobs. Queue claim is authoritative PostgreSQL state.
        run: node scripts/process-postgres-command-queue.mjs
