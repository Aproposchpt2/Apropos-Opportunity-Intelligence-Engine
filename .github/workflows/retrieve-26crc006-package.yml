name: Retrieve 26CRC006 Contract Package

on:
  push:
    branches: [main]
    paths:
      - scripts/retrieve-calprocure-package.mjs
      - .github/workflows/retrieve-26crc006-package.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install browser automation runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Retrieve official Cal eProcure package
        run: node scripts/retrieve-calprocure-package.mjs
      - name: Inventory retrieved files
        if: always()
        run: |
          find artifacts/26CRC006 -maxdepth 3 -type f -printf '%s %p\n' | sort -n | tee artifacts/26CRC006/inventory.txt || true
      - name: Upload retrieval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 26CRC006-official-package-evidence
          path: artifacts/26CRC006
          if-no-files-found: error
          retention-days: 7
