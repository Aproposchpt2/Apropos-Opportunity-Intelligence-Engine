name: Download 26CRC006 Official Package V5
on:
  push:
    branches: [main]
    paths:
      - scripts/download-26crc006-package-v5.mjs
      - .github/workflows/download-26crc006-package-v5.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: node scripts/download-26crc006-package-v5.mjs
      - if: always()
        run: find artifacts/26CRC006-package-v5 -type f -printf '%s %p\n' | sort -n | tee artifacts/26CRC006-package-v5/inventory.txt || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 26CRC006-official-package-v5
          path: artifacts/26CRC006-package-v5
          if-no-files-found: error
          retention-days: 7
