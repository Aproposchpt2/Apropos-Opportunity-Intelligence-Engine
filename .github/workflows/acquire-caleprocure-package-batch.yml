name: Acquire Cal eProcure Package Batch

on:
  push:
    branches:
      - caleprocure-persistence-validation-001
    paths:
      - scripts/acquire-caleprocure-package-batch.mjs
      - .github/workflows/acquire-caleprocure-package-batch.yml

concurrency:
  group: caleprocure-package-acquisition
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/acquire-caleprocure-package-batch.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caleprocure-package-batch-${{ github.run_id }}
          path: |
            caleprocure-package-batch-result.json
            artifacts/caleprocure-package-batch/**
          if-no-files-found: warn
          retention-days: 30
