name: Acquire Cal eProcure Package Batch

on:
  workflow_dispatch:
    inputs:
      target_completions:
        description: Contracts to complete in this qualification run
        required: false
        default: '1'
        type: string
      target_source_record_id:
        description: Optional exact Cal eProcure source record for qualification
        required: false
        default: '2740:26-086'
        type: string

  push:
    branches:
      - main
    paths:
      - scripts/acquire-caleprocure-package-batch.mjs
      - scripts/caleprocure-batch/**
      - .github/workflows/acquire-caleprocure-package-batch.yml

concurrency:
  group: caleprocure-package-acquisition-v3
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TARGET_COMPLETIONS: '1'
      TARGET_SOURCE_RECORD_ID: ${{ github.event.inputs.target_source_record_id || '2740:26-086' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Acquire and persist targeted Cal eProcure package
        run: node scripts/acquire-caleprocure-package-batch.mjs

      - name: Upload acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caleprocure-package-batch-${{ github.run_id }}
          path: |
            caleprocure-package-batch-result.json
            artifacts/caleprocure-package-batch/**
          if-no-files-found: warn
          retention-days: 30

# Qualification phase: one targeted contract per run. Automatic continuation remains disabled
# while package weight, persistence, reconciliation, and timeout behavior are measured.
