name: Acquire Cal eProcure Package Batch

on:
  workflow_dispatch:
    inputs:
      target_completions:
        description: Contracts to complete in this qualification run
        required: false
        default: '1'
        type: string
      target_source_record_id:
        description: Optional exact Cal eProcure source record for qualification
        required: false
        default: ''
        type: string
      sequence_run:
        description: Qualification sequence run number
        required: false
        default: '1'
        type: string
      max_runs:
        description: Maximum qualification runs in this sequence
        required: false
        default: '3'
        type: string

  push:
    branches:
      - main
    paths:
      - scripts/acquire-caleprocure-package-batch.mjs
      - scripts/caleprocure-batch/**
      - .github/workflows/acquire-caleprocure-package-batch.yml

concurrency:
  group: caleprocure-package-acquisition-v3
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TARGET_COMPLETIONS: '1'
      TARGET_SOURCE_RECORD_ID: ${{ github.event.inputs.target_source_record_id || '' }}
      SEQUENCE_RUN: ${{ github.event.inputs.sequence_run || '1' }}
      MAX_RUNS: ${{ github.event.inputs.max_runs || '3' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Acquire and persist one Cal eProcure package
        run: node scripts/acquire-caleprocure-package-batch.mjs

      - name: Upload acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caleprocure-package-batch-${{ github.run_id }}
          path: |
            caleprocure-package-batch-result.json
            artifacts/caleprocure-package-batch/**
          if-no-files-found: warn
          retention-days: 30

      - name: Schedule next qualification run after five minutes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="${SEQUENCE_RUN}"
          maximum="${MAX_RUNS}"

          if [ "$current" -ge "$maximum" ]; then
            echo "Qualification sequence complete at run ${current}/${maximum}."
            exit 0
          fi

          next=$((current + 1))
          echo "Run ${current}/${maximum} reached a terminal state. Waiting five minutes before scheduling run ${next}/${maximum}."
          echo "Continuation is independent of the prior run result; failed contracts remain available for separate retry/recovery logic."
          sleep 300

          payload="$(printf '{\"ref\":\"main\",\"inputs\":{\"target_completions\":\"1\",\"target_source_record_id\":\"\",\"sequence_run\":\"%s\",\"max_runs\":\"%s\"}}' "$next" "$maximum")"
          status="$(curl -sS -o /tmp/qualification-dispatch-response -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/acquire-caleprocure-package-batch.yml/dispatches" \
            -d "$payload")"

          if [ "$status" != "204" ]; then
            cat /tmp/qualification-dispatch-response || true
            echo "Qualification continuation dispatch failed with HTTP ${status}."
            exit 1
          fi

          echo "Scheduled qualification run ${next}/${maximum}."

# Controlled qualification sequence: one contract per run, five-minute delay between runs,
# maximum three runs. The sequence continues after either success or failure so one bad
# contract cannot halt acquisition of the next eligible contract.
