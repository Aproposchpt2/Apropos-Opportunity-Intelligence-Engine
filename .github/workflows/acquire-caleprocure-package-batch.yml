name: Acquire Cal eProcure Package Batch

on:
  workflow_dispatch:
    inputs:
      target_completions:
        description: Contracts to complete in this batch (1-5)
        required: false
        default: '5'
        type: string

  push:
    branches:
      - main
    paths:
      - scripts/acquire-caleprocure-package-batch.mjs
      - scripts/caleprocure-batch/**
      - .github/workflows/acquire-caleprocure-package-batch.yml

concurrency:
  group: caleprocure-package-acquisition-v3
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TARGET_COMPLETIONS: ${{ github.event.inputs.target_completions || '5' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Acquire and persist Cal eProcure package batch
        run: node scripts/acquire-caleprocure-package-batch.mjs

      - name: Upload acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caleprocure-package-batch-${{ github.run_id }}
          path: |
            caleprocure-package-batch-result.json
            artifacts/caleprocure-package-batch/**
          if-no-files-found: warn
          retention-days: 30

      - name: Continue eligible Cal eProcure backlog
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remaining="$(node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('caleprocure-package-batch-result.json','utf8'));process.stdout.write(String(Number(r.remaining_eligible_backlog||0)))")"
          if [ "$remaining" -le 0 ]; then
            echo "Cal eProcure eligible backlog exhausted."
            exit 0
          fi

          next_target="$remaining"
          if [ "$next_target" -gt 5 ]; then
            next_target=5
          fi

          payload="$(printf '{\"ref\":\"main\",\"inputs\":{\"target_completions\":\"%s\"}}' "$next_target")"
          status="$(curl -sS -o /tmp/caleprocure-dispatch-response -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/acquire-caleprocure-package-batch.yml/dispatches" \
            -d "$payload")"

          if [ "$status" != "204" ]; then
            cat /tmp/caleprocure-dispatch-response || true
            echo "Continuation dispatch failed with HTTP ${status}."
            exit 1
          fi

          echo "Queued next Cal eProcure batch for ${next_target} completion(s); ${remaining} eligible contracts remain."

# Concurrency generation v3 serializes the production continuation chain.
