name: Send Executive Recovery Once

on:
  push:
    branches:
      - ops/send-executive-recovery-20260805

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Request production Executive recovery email
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --max-time 30 \
            'https://apie.aproposgroupllc.com/.netlify/functions/executive-auth' \
            -H 'Origin: https://apie.aproposgroupllc.com' \
            -H 'Content-Type: application/json' \
            --data '{"action":"reset","email":"jmitchell@aproposgroupllc.com"}')"
          printf '%s\n' "$response"
          grep -q '"ok":true' <<<"$response"
          grep -q 'APROPOS recovery email has been sent' <<<"$response"
